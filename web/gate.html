<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shelfwatchr · closed beta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<!-- Styles are inline because /static is behind the same gate as everything
     else: a stylesheet fetched from here would come back as a redirect. -->
<style>
:root {
  --bg: #fbfaf8; --card: #fff; --ink: #1b1a18; --muted: #6b6660; --line: #e6e2dc;
  --err-bg: #fbe6e4; --err-ink: #963028;
  --accent: #3a6ea5; --accent-ink: #fff; --focus: #3a6ea5; --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --card: #202225; --ink: #ece9e4; --muted: #9a948c; --line: #32353a;
    --err-bg: #3d1f1d; --err-ink: #f0a49c;
    --accent: #4d81b8; --accent-ink: #fff; --focus: #8ab4e8;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 16px 80px; background: var(--bg); color: var(--ink);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.wrap { max-width: 420px; margin: 0 auto; padding-top: 12vh; }
h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }
.lede { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin: 20px 0;
}
label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
input {
  width: 100%; padding: 10px 12px; font-size: 1rem; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
button {
  width: 100%; margin-top: 12px; padding: 10px 14px; font-size: 1rem; font-weight: 600;
  color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 8px;
  cursor: pointer;
}
button[disabled] { opacity: 0.6; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.error {
  margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem;
  background: var(--err-bg); color: var(--err-ink);
}
.foot { color: var(--muted); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Shelfwatchr</h1>
  <p class="lede">Closed beta. You'll have been sent the password along with the link.</p>

  <div class="panel">
    <form id="form" novalidate>
      <label for="password">Password</label>
      <!-- current-password, so a password manager offers to remember it. -->
      <input type="password" id="password" name="password"
             autocomplete="current-password" autofocus required>
      <button type="submit" id="submit">Enter</button>
    </form>
    <p class="error" id="error" role="alert" hidden></p>
  </div>

  <p class="foot">Nothing to sign up for — one password lets everyone in.</p>

</div>
<script>
const form = document.getElementById("form");
const field = document.getElementById("password");
const button = document.getElementById("submit");
const error = document.getElementById("error");

/** Where to land afterwards. Read here and sent back to the server, which
 *  re-checks it: a query parameter is not something to redirect on unexamined. */
const next = new URLSearchParams(location.search).get("next") || "/";

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  error.hidden = true;
  button.disabled = true;
  button.textContent = "Checking…";
  try {
    const response = await fetch("/api/gate", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ password: field.value, next }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "That didn't work.");
    location.href = data.next || "/";
    return;
  } catch (err) {
    error.textContent = err.message;
    error.hidden = false;
    field.select();
  }
  button.disabled = false;
  button.textContent = "Enter";
});
</script>
</body>
</html>
